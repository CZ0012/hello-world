name: Lean verification

on:
  push:
    branches:
      - fiber-aggregation-lean
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and verify Lean proofs
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"
