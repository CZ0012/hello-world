name: Lean verification

on:
  push:
    branches:
      - fiber-aggregation-lean
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Resolve dependencies
        run: lake update
      - name: Download mathlib cache
        run: lake exe cache get
      - name: Build and verify proofs
        run: lake build --wfail
